name: Update Taiwan Tax Revenue

on:
  workflow_dispatch:

  # 每天臺灣時間 09:15 自動檢查一次（GitHub Actions 使用 UTC）
  schedule:
    - cron: "15 1 * * *"

permissions:
  contents: read

concurrency:
  group: taiwan-tax-update
  cancel-in-progress: false

jobs:
  update-tax:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. 取得 GitHub 程式
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 安裝 Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 3. 安裝必要套件
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. 先執行所有離線測試
      - name: Run automated tests
        run: |
          python -m unittest discover -s tests -v

      # 5. 爬取財政部每月統計
      - name: Download monthly tax Excel
        run: |
          python crawler.py

      # 6. 整理資料並驗證
      - name: Process and validate tax data
        run: |
          python processor.py

      # 7. 確認 Google Secrets 已設定
      - name: Check Google credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON" || exit 1
          test -n "$GOOGLE_SHEET_ID" || exit 1
          echo "Google credentials are configured."

      # 8. 更新原本的稅收原始資料
      - name: Update Google Sheets
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          python update_sheets.py

      # 9. 擷取每月新聞稿的官方累計分配預算達成率
      - name: Extract news metrics
        run: |
          python news_metrics.py

      # 10. 更新獨立的新聞稿月度指標工作表
      - name: Update news metrics
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          python update_news_metrics.py

      # 11. 保存驗證報告，方便查詢執行結果
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tax-validation
          path: |
            data/manifest.json
            data/validation.json
            data/news_metrics_validation.json
          retention-days: 14
          if-no-files-found: ignore
